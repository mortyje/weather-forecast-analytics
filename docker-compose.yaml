name: weather-forecast-analytics


x-airflow-common: &airflow-common
  image: weather-forecast-airflow:3.3.2

  build:
    context: .
    dockerfile: airflow/Dockerfile

  user: "${AIRFLOW_UID:-50000}:0"

  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow_user:${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}@postgres:5432/airflow_meta

    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?AIRFLOW_FERNET_KEY is required}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?AIRFLOW_JWT_SECRET is required}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?AIRFLOW_API_SECRET_KEY is required}

    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/auth/passwords.json

    AIRFLOW__API__BASE_URL: http://localhost:8080

    DBT_HOST: postgres
    DBT_DB_NAME: ${POSTGRES_DB:?POSTGRES_DB is required}
    DBT_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
    DBT_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    DBT_ENGINE_TARGET_PATH: /tmp/dbt-target
    DBT_ENGINE_LOG_PATH: /tmp/dbt-logs

    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: ${POSTGRES_DB}
    PGUSER: ${POSTGRES_USER}
    PGPASSWORD: ${POSTGRES_PASSWORD}

    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_FORECAST_TOPIC: weather.forecasts.raw
    KAFKA_OBSERVATION_TOPIC: weather.observations.raw

  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./dbt:/opt/airflow/dbt:ro
    - ./ingestion/config:/opt/airflow/ingestion/config:ro
    - airflow_logs:/opt/airflow/logs
    - airflow_auth:/opt/airflow/auth


services:
  airflow-db-init:
    image: postgres:17.12
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?AIRFLOW_DB_PASSWORD is required}

    volumes:
      - ./airflow/db/init-airflow.sh:/scripts/init-airflow.sh:ro

    entrypoint: ["/bin/sh", "/scripts/init-airflow.sh"]

  airflow-init:
    <<: *airflow-common
    restart: "no"

    depends_on:
      airflow-db-init:
        condition: service_completed_successfully

    command: ["db", "migrate"]

  airflow-api-server:
    <<: *airflow-common
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    ports:
      - "127.0.0.1:8080:8080"

    command: ["api-server"]

  airflow-scheduler:
    <<: *airflow-common
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-api-server:
        condition: service_started

    command: ["scheduler"]

  airflow-dag-processor:
    <<: *airflow-common
    restart: unless-stopped

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    command: ["dag-processor"]


  postgres:
    image: postgres:17.12
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  ingestion:
    build:
      context: ./ingestion
      target: runtime

    profiles:
      - jobs

    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_FORECAST_TOPIC: weather.forecasts.raw
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}

    command:
      - --locations
      - /app/config/locations.json
      - --output
      - kafka


  kafka:
    image: apache/kafka:4.4.0
    restart: unless-stopped

    ports:
      - "127.0.0.1:29092:29092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      KAFKA_OBSERVATION_TOPIC: weather.observations.raw

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s


  kafka-init:
    image: apache/kafka:4.4.0
    restart: "no"

    depends_on:
      kafka:
        condition: service_healthy

    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic weather.forecasts.raw \
          --partitions 3 \
          --replication-factor 1 \
          --config retention.ms=604800000

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:9092 \
          --create \
          --if-not-exists \
          --topic weather.observations.raw \
          --partitions 3 \
          --replication-factor 1

  database-init:
    image: postgres:17.12
    restart: "no"

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - ./database/init/001_raw.sql:/sql/001_raw.sql:ro
      - ./database/migrations/002_create_observation_events.sql:/sql/002_create_observation_events.sql:ro

    entrypoint: ["psql"]

    command:
      - -X
      - -v
      - ON_ERROR_STOP=1
      - -f
      - /sql/001_raw.sql
      - -f
      - /sql/002_create_observation_events.sql


  spark:
    build:
      context: ./spark

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_FORECAST_TOPIC: weather.forecasts.raw
      KAFKA_OBSERVATION_TOPIC: weather.observations.raw
      OBSERVATIONS_CHECKPOINT_PATH: /opt/spark/checkpoints/observations

      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?POSTGRES_DB is required}
      PGUSER: ${POSTGRES_USER:?POSTGRES_USER is required}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      TZ: UTC

    ports:
      - "127.0.0.1:4040:4040"

    volumes:
      - spark_checkpoints:/opt/spark/checkpoints
      - spark_ivy:/opt/spark/.ivy2

    entrypoint: ["/opt/spark/bin/spark-submit"]

    command:
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.13:4.2.1
      - --conf
      - spark.jars.ivy=/opt/spark/.ivy2
      - --conf
      - spark.sql.session.timeZone=UTC
      - /opt/spark/jobs/kafka_to_raw.py


volumes:
  postgres_data:
  kafka_data:
  spark_checkpoints:
  spark_ivy:
  airflow_logs:
  airflow_auth: