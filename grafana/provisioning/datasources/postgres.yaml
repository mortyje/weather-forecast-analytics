apiVersion: 1

datasources:
  - name: Weather Analytics DWH
    uid: weather-dwh
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false

    jsonData:
      database: $__env{GRAFANA_PG_DATABASE}
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400

    secureJsonData:
      password: $__env{GRAFANA_READER_PASSWORD}
