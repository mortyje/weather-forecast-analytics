
[build-system]
requires = ["setuptools>=75,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-ingestion"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1.0",
    "confluent-kafka==2.16.1",
    "tzdata==2026.6",
    "meteostat==2.2.3",
    "psycopg[binary]==3.2.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.13,<1.0",
]

[project.scripts]
weather-ingestion = "weather_ingestion.forecasts.main:main"
weather-stations = "weather_ingestion.observations.discovery:main"
weather-observations = "weather_ingestion.observations.collection:main"
weather-observations-backfill = "weather_ingestion.observations.backfill:main"
weather-forecasts-backfill = "weather_ingestion.forecasts.backfill:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["weather_ingestion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]