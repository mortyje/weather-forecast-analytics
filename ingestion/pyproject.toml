
[build-system]
requires = ["setuptools>=75,<90"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-ingestion"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1.0",
    "confluent-kafka==2.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.13,<1.0",
]

[project.scripts]
weather-ingestion = "weather_ingestion.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]