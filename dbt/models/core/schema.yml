version: 2

models:
  - name: core_locations
    description: Актуальный справочник локаций Core DWH.

    columns:
      - name: location_id
        data_tests:
          - not_null
          - unique

      - name: name
        data_tests:
          - not_null

      - name: latitude
        data_tests:
          - not_null

      - name: longitude
        data_tests:
          - not_null

      - name: timezone
        data_tests:
          - not_null

      - name: last_seen_at
        data_tests:
          - not_null

  - name: core_weather_sources
    description: Справочник источников погодных данных.

    columns:
      - name: source_id
        data_tests:
          - not_null
          - unique

      - name: name
        data_tests:
          - not_null

      - name: last_seen_at
        data_tests:
          - not_null

  - name: core_forecast_snapshots
    description: Исторические снимки прогнозов погоды.

    columns:
      - name: snapshot_id
        data_tests:
          - not_null
          - unique

      - name: location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_locations')
                field: location_id

      - name: source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_weather_sources')
                field: source_id

      - name: requested_at
        data_tests:
          - not_null

      - name: collected_at
        data_tests:
          - not_null

      - name: raw_topic
        data_tests:
          - not_null

      - name: raw_partition
        data_tests:
          - not_null

      - name: raw_offset
        data_tests:
          - not_null

  - name: core_forecast_hours
    description: Почасовые прогнозы каждого снимка.

    columns:
      - name: snapshot_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_forecast_snapshots')
                field: snapshot_id

      - name: forecast_for
        data_tests:
          - not_null

  - name: core_weather_stations
    description: Справочник метеостанций.

    columns:
      - name: station_key
        data_tests:
          - not_null
          - unique

      - name: source_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_weather_sources')
                field: source_id

      - name: station_id
        data_tests:
          - not_null

      - name: name
        data_tests:
          - not_null

  - name: core_location_station_assignments
    description: История назначений станций городам.

    columns:
      - name: assignment_id
        data_tests:
          - not_null
          - unique

      - name: location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_locations')
                field: location_id

      - name: station_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_weather_stations')
                field: station_key

      - name: valid_from
        data_tests:
          - not_null

  - name: core_weather_observations
    description: Актуальные почасовые измерения метеостанций.

    columns:
      - name: station_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_weather_stations')
                field: station_key

      - name: observed_at
        data_tests:
          - not_null

      - name: source_event_id
        data_tests:
          - not_null

      - name: source_collected_at
        data_tests:
          - not_null

  - name: core_archive_forecast_runs
    description: Уникальные исторические выпуски погодных моделей.

    columns:
      - name: archive_run_id
        data_tests:
          - not_null
          - unique

      - name: location_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_locations')
                field: location_id

      - name: model_run_at
        data_tests:
          - not_null

  - name: core_archive_forecast_hours
    description: Почасовые значения выбранных версий архивных выпусков.

    columns:
      - name: archive_run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('core_archive_forecast_runs')
                field: archive_run_id

      - name: forecast_for
        data_tests:
          - not_null

      - name: model_horizon_hours
        data_tests:
          - not_null
